<!-- TAB 2: RATIO & CANVASES -->
<div x-show="activeTab === 'ratio'" class="flex flex-col gap-2">
  <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 flex flex-col gap-2">
    <div class="flex items-center gap-1.5">
      <i data-lucide="proportions" class="w-4 h-4 text-blue-400"></i>
      <span class="text-xs font-semibold text-slate-200">Preset Rasio Canvas</span>
    </div>
    <div class="grid grid-cols-3 gap-1.5">
      <template x-for="preset in ratioPresets" :key="preset.name">
        <button @click="applyRatioPreset(preset.w, preset.h)" 
                class="px-2 py-2 rounded-lg bg-slate-900 border text-[10px] font-semibold flex flex-col items-center cursor-pointer min-h-[40px] justify-center"
                :class="(CANVAS_W === preset.w && CANVAS_H === preset.h) ? 'border-blue-500 bg-blue-950/50 text-blue-300' : 'border-slate-800 text-slate-300'">
          <span x-text="preset.name"></span>
        </button>
      </template>
    </div>

    <div class="border-t border-slate-800/80 pt-2 grid grid-cols-2 gap-2">
      <div class="flex flex-col gap-1">
        <label class="text-[9px] text-slate-400">Lebar (px):</label>
        <input type="number" min="100" max="4000" x-model.number="tempW" @change="updateCanvasDimensions()" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-center font-mono text-blue-400 text-xs min-h-[36px]">
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-[9px] text-slate-400">Tinggi (px):</label>
        <input type="number" min="100" max="4000" x-model.number="tempH" @change="updateCanvasDimensions()" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-center font-mono text-blue-400 text-xs min-h-[36px]">
      </div>
    </div>
  </div>
</div>
